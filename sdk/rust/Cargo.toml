[package]
name = "pg_sidefx"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the pg_sidefx PostgreSQL extension (integration test helpers)"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-serde_json-1"] }

[dev-dependencies]
testcontainers = "0.23"
